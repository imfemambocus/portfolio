server {
  # 8080, not 80: the unprivileged nginx runs as a non-root user and cannot bind a
  # privileged (<1024) port. the container publishes this port instead.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # the base image ships with gzip off, and this app is mostly one large js chunk, so
  # without this nginx serves ~960kB uncompressed where 254kB would do. woff2 is
  # deliberately absent from the type list: it is already compressed internally.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # long-cache the hashed build assets; they are content-addressed so this is safe.
  # one add_header rather than `expires 1y` plus add_header: those emit two separate
  # Cache-Control headers, which is legal but handled inconsistently by intermediaries.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names those hashed assets, so it must never be cached: a stale copy
  # points at filenames that no longer exist after a deploy
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # single page app: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
