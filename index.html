<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Isfaaq M. F. Emambocus</title>
    <meta
      name="description"
      content="Isfaaq M. F. Emambocus, R&amp;D Specialist at the LCSB, University of Luxembourg. Frontend-leaning full-stack developer."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070707" />

    <!-- apply the stored theme before first paint, otherwise a returning visitor on light
         gets a flash of dark. dark is the default when nothing is stored. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          /* storage blocked: fall through to dark */
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f3')
        }
      })()
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Isfaaq M. F. Emambocus" />
    <meta
      property="og:description"
      content="R&amp;D Specialist at the LCSB, University of Luxembourg. Frontend-leaning full-stack developer."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
