    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />

    <!-- apply the stored theme before first paint, otherwise a returning visitor on light
         gets a flash of dark. dark is the default when nothing is stored. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          /* storage blocked: fall through to dark */
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f3')
        }
      })()
    </script>

    <!-- the overlay has to paint on the very first frame, before the stylesheet exists, so
         its critical rules live here. the four hexes are the paper and ink pairs from
         src/index.css and have to move with them; they are only ever reached in dev, since
         the production build puts the stylesheet in a render-blocking link above this. -->
    <style>
      #preload {
        position: fixed;
        inset: 0;
        z-index: 100;
        color: var(--color-ink, #f6f6f3);
      }

      :root[data-theme='light'] #preload {
        color: var(--color-ink, #17171c);
      }

      #preload[data-split] {
        pointer-events: none;
      }

      /*
       * two opaque halves that slide apart, never one panel fading its opacity. partial
       * alpha floors a level in the compositor, and a paper-over-paper fade on this
       * near-black surface renders 5 where the page renders 7, in hard full-width bands.
       */
      .preload-half {
        position: absolute;
        left: 0;
        right: 0;
        background: var(--color-paper, #000000);
        transition: transform 760ms cubic-bezier(0.76, 0, 0.24, 1);
      }

      :root[data-theme='light'] .preload-half {
        background: var(--color-paper, #f6f6f3);
      }

      #preload-top {
        top: 0;
        height: 50%;
      }

      #preload-bottom {
        top: 50%;
        bottom: 0;
      }

      #preload[data-split] #preload-top {
        transform: translateY(-100%);
      }

      #preload[data-split] #preload-bottom {
        transform: translateY(100%);
      }

      /* the loading track, and the seam the two halves part along */
      .preload-line {
        position: absolute;
        left: 50%;
        overflow: hidden;
        width: max(240px, 14vw);
        height: 1px;
        transform: translateX(-50%);
        transition: width 400ms cubic-bezier(0.65, 0, 0.35, 1);
      }

      #preload-top .preload-line {
        bottom: 0;
      }

      /* -1px so the two lines sit on the same row and read as one until they part */
      #preload-bottom .preload-line {
        top: -1px;
      }

      #preload[data-open] .preload-line {
        width: 100%;
      }

      .preload-line::before {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        transition: opacity 400ms ease;
      }

      #preload-top .preload-line::before {
        opacity: 0.2;
      }

      #preload-bottom .preload-line::before {
        opacity: 0;
      }

      /* the track brightens into a solid hairline, which swallows the sweep without a jump */
      #preload[data-open] #preload-top .preload-line::before,
      #preload[data-split] #preload-bottom .preload-line::before {
        opacity: 1;
      }

      #preload-top .preload-line::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 30%;
        background: currentColor;
        animation: preload-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes preload-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(333.34%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .preload-half,
        .preload-line,
        .preload-line::before {
          transition: none;
        }

        #preload-top .preload-line::after {
          width: 100%;
          animation: none;
        }
      }
    </style>
