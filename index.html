    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070707" />

    <!-- apply the stored theme before first paint, otherwise a returning visitor on light
         gets a flash of dark. dark is the default when nothing is stored. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (error) {
          /* storage blocked: fall through to dark */
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f3')
        }
      })()
    </script>
